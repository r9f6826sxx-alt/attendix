<!DOCTYPE html>
<html>
<head>
  <title>Rénora</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Rénora 💅</h1>
<div class="card">
  <h3>Login</h3>

  <input id="email" placeholder="Email">

  <input id="pass" type="password" placeholder="Password">

  <br>

  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
</div>
<div class="card">
  <h3>Enter Current Attendance</h3>
  <input id="baseA" placeholder="Attended">
  <input id="baseT" placeholder="Total">
  <button onclick="setInitial()">Set</button>
</div>

<div class="card">
  <h3>Add to Timetable</h3>

  <select id="day">
    <option value="1">Monday</option>
    <option value="2">Tuesday</option>
    <option value="3">Wednesday</option>
    <option value="4">Thursday</option>
    <option value="5">Friday</option>
    <option value="6">Saturday</option>
  </select>

  <input id="subject" placeholder="Subject">
  <input id="hours" placeholder="Hours (1/2/3)">
  <button onclick="addClass()">Add</button>
</div>

<div class="card">
  <h3>Today's Classes</h3>
  <div id="today"></div>
</div>

<div class="card">
  <h3>Overall Attendance</h3>
  <p id="result">0%</p>
</div>

<script src="script.js"></script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, setDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 PASTE YOUR CONFIG HERE
const firebaseConfig = {
  apiKey: "PASTE",
  authDomain: "PASTE",
  projectId: "PASTE"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

// SIGN UP
window.signup = async function() {
  let email = document.getElementById("email").value;
  let pass = document.getElementById("pass").value;

  try {
    let user = await createUserWithEmailAndPassword(auth, email, pass);
    alert("Signed up!");
  } catch (e) {
    alert(e.message);
  }
}

// LOGIN
window.login = async function() {
  let email = document.getElementById("email").value;
  let pass = document.getElementById("pass").value;

  try {
    let user = await signInWithEmailAndPassword(auth, email, pass);
    alert("Logged in!");
  } catch (e) {
    alert(e.message);
  }
}

// SAVE DATA
window.saveUserData = async function(userId, data) {
  await setDoc(doc(db, "users", userId), data);
}

// LOAD DATA
window.loadUserData = async function(userId) {
  let snap = await getDoc(doc(db, "users", userId));
  if (snap.exists()) {
    console.log(snap.data());
  }
}

</script>
</body>
</html>
